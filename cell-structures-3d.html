<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>الخلية: تراكيب ووظائف</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@600;800&family=IBM+Plex+Sans+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--panel:rgba(14,26,18,.86);--ink:#EAF5EC;--muted:#A9C2AF;--line:rgba(255,255,255,.14);--accent:#7BD88A;--ok:#4ADE80;--ok-bg:rgba(34,120,60,.35);--bad:#FDBA74;--bad-bg:rgba(160,70,20,.35);
 --display:"Baloo Bhaijaan 2","IBM Plex Sans Arabic",system-ui,sans-serif;--body:"IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;color-scheme:dark}
*{box-sizing:border-box}html,body{height:100%;margin:0;direction:rtl}
body{background:#050C07;color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.6;overflow:hidden}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}#cv:active{cursor:grabbing}
.top{position:fixed;top:0;inset-inline:0;z-index:5;padding:calc(10px + env(safe-area-inset-top,0px)) 14px 0;display:flex;gap:8px;justify-content:center;align-items:center;flex-wrap:wrap;pointer-events:none}
.top>*{pointer-events:auto}
h1{margin:0;font:800 clamp(1.05rem,3vw,1.45rem)/1.25 var(--display);background:var(--panel);padding:5px 16px 3px;border-radius:99px;border:1px solid var(--line);backdrop-filter:blur(8px)}
h1 small{font:600 .72rem var(--body);color:#FFD27A;margin-inline-start:6px}
.pill{border:1px solid var(--line);background:var(--panel);color:var(--ink);font:600 .82rem var(--body);padding:6px 12px;border-radius:99px;cursor:pointer;text-decoration:none;backdrop-filter:blur(8px)}
.pill b{color:var(--accent)}
.card{position:fixed;z-index:6;background:var(--panel);border:1px solid var(--line);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 10px 40px rgba(0,0,0,.45)}
@media (min-width:760px){.card{inset-inline-end:16px;top:72px;bottom:16px;width:min(400px,36vw);border-radius:22px;overflow:auto}}
@media (max-width:759px){.card{inset-inline:0;bottom:0;max-height:44vh;border-radius:22px 22px 0 0;overflow:auto;padding-bottom:env(safe-area-inset-bottom,0px)}}
.cin{padding:16px 18px 18px;display:grid;gap:9px}
.cin p{margin:0}.kick{color:var(--accent);font-weight:700;font-size:.85rem}
.cin h2{margin:0;font:800 1.35rem/1.25 var(--display)}
.hint{color:var(--muted);font-size:.9rem}
.info{background:rgba(123,216,138,.12);border:1px solid rgba(123,216,138,.35);border-radius:14px;padding:9px 12px}.info b{display:block;color:var(--accent);font-size:1.05rem}
.go{border:0;background:linear-gradient(135deg,#5CCB6E,#2F8A3E);color:#fff;font:800 1.05rem var(--body);padding:12px;border-radius:14px;cursor:pointer;box-shadow:0 6px 20px rgba(47,138,62,.45)}
.parts{display:flex;flex-wrap:wrap;gap:6px}.parts button{border:1.5px solid var(--line);background:rgba(255,255,255,.04);color:var(--muted);font:600 .85rem var(--body);padding:4px 11px;border-radius:99px;cursor:pointer}
.parts button.got{border-color:var(--ok);color:var(--ink);background:var(--ok-bg)}.parts button.on{outline:2px solid #FFD27A;outline-offset:1px}
.cnt{font-size:.85rem;color:var(--muted)}
.row{display:flex;gap:6px;flex-wrap:wrap}.tg{flex:1;min-width:150px;border:1.5px solid var(--line);background:rgba(255,255,255,.06);color:var(--ink);font:700 .88rem var(--body);padding:8px 10px;border-radius:12px;cursor:pointer}
.q{display:grid;gap:6px;border-top:1px solid var(--line);padding-top:10px}.q>p:first-child{font-weight:700}
.opt{text-align:start;border:1.5px solid var(--line);background:rgba(255,255,255,.04);color:var(--ink);font:600 .92rem var(--body);padding:8px 12px;border-radius:12px;cursor:pointer}
.opt.right{border-color:var(--ok);background:var(--ok-bg)}.opt.wrong{border-color:var(--bad);background:var(--bad-bg);opacity:.85}
.fb{font-size:.92rem;border-radius:10px;padding:0}.fb.ok{background:var(--ok-bg);padding:8px 10px}.fb.bad{background:var(--bad-bg);padding:8px 10px}
.cr{font-size:.75rem;color:var(--muted);text-align:center;margin-top:4px}
#labels{position:fixed;inset:0;pointer-events:none;z-index:4;overflow:hidden}
.lbl{position:absolute;left:0;top:0;background:rgba(8,16,10,.82);color:#F2FFF4;font:700 13px var(--body);padding:3px 11px;border-radius:99px;white-space:nowrap;border:1px solid rgba(255,255,255,.25);opacity:0}
.lbl.pin{background:#FFD27A;color:#1B2A10;border-color:#fff;font-size:14px}
.lbl.pin:after{content:"";position:absolute;left:50%;bottom:-7px;width:2px;height:7px;background:#FFD27A;transform:translateX(-50%)}
#toast{pointer-events:none;position:fixed;z-index:8;top:64px;left:50%;transform:translateX(-50%);background:#FFD27A;color:#1B2A10;font-weight:700;font-size:.9rem;padding:8px 16px;border-radius:14px;max-width:min(92vw,520px);text-align:center;box-shadow:0 6px 20px rgba(0,0,0,.4)}
@media (max-width:759px){#toast{top:auto;bottom:calc(44vh + 12px)}}

.top{flex-direction:column}.r1{display:flex;gap:8px;justify-content:center;align-items:center;flex-wrap:wrap;pointer-events:none}.r1>*{pointer-events:auto}
#crumbs{display:flex;gap:2px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:99px;padding:3px;backdrop-filter:blur(8px);flex-wrap:wrap;justify-content:center}
#crumbs button{border:0;background:none;color:var(--muted);font:700 .82rem var(--body);padding:4px 11px;border-radius:99px;cursor:pointer}#crumbs button.on{background:var(--accent);color:#0B2010}#crumbs i{color:var(--muted);font-style:normal;font-size:.75rem}
.side{position:fixed;inset-inline-start:max(12px,env(safe-area-inset-right,0px));top:50%;transform:translateY(-50%);z-index:5;display:grid;gap:6px;justify-items:center;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:8px 6px;backdrop-filter:blur(8px)}
.side button{width:40px;height:40px;border-radius:50%;border:1.5px solid var(--line);background:rgba(255,255,255,.06);color:var(--ink);font:700 1.3rem var(--body);cursor:pointer;line-height:1}
#zr{writing-mode:vertical-lr;direction:rtl;height:min(200px,26vh);width:28px;accent-color:var(--accent)}.side small{font-size:.7rem;color:var(--muted)}
@media (max-width:759px){.side{top:calc(50% - 21vh);padding:6px 4px}.side button{width:34px;height:34px;font-size:1.1rem}#zr{height:min(130px,16vh)}h1{font-size:1rem;padding:4px 12px 2px}#crumbs button{padding:3px 8px;font-size:.76rem}.pill{padding:4px 10px;font-size:.76rem}}
.lbl.zm{background:#FFE066;color:#1B2A10;border-color:#fff}

#load{position:fixed;inset:0;z-index:9;display:grid;place-items:center;background:#050C07;color:var(--ink);font:700 1.1rem var(--body)}

.top{flex-direction:column}.r1{display:flex;gap:8px;justify-content:center;align-items:center;flex-wrap:wrap;pointer-events:none}.r1>*{pointer-events:auto}
#tabs{display:flex;gap:3px;background:var(--panel);border:1px solid var(--line);border-radius:99px;padding:3px;backdrop-filter:blur(8px);flex-wrap:wrap;justify-content:center;pointer-events:auto}
#tabs button{border:0;background:none;color:var(--muted);font:700 .8rem var(--body);padding:4px 11px;border-radius:99px;cursor:pointer}#tabs button b{font-weight:800}
#tabs button.on{background:var(--accent);color:#0B2010}#tabs button.ok:not(.on){color:var(--ok)}
.cin small{display:block;color:var(--muted);font-size:.78rem}
.seg{display:flex;gap:4px;background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:12px;padding:3px}.seg button{flex:1;border:0;background:none;color:var(--muted);font:700 .86rem var(--body);padding:7px;border-radius:9px;cursor:pointer}.seg button.on{background:rgba(123,216,138,.22);color:var(--ink)}
.orgs{display:grid;gap:6px}.orow{display:flex;align-items:center;justify-content:space-between;gap:6px;border:1.5px solid var(--line);border-radius:12px;padding:5px 6px;flex-wrap:wrap}.orow.on{border-color:#FFD27A}.orow.ok{border-color:var(--ok);background:var(--ok-bg)}
.orow .on-n{border:0;background:none;color:var(--ink);font:700 .95rem var(--body);cursor:pointer;padding:3px 4px}.orow span{display:flex;gap:4px}
.cl{border:1.5px solid var(--line);background:rgba(255,255,255,.06);color:var(--ink);font:600 .8rem var(--body);padding:5px 9px;border-radius:99px;cursor:pointer}.cl:disabled{opacity:.4;cursor:default}
.lb{font-weight:700;font-size:.85rem;color:var(--muted);margin:2px 0 -3px!important}.lb small{display:inline;font-weight:600}
.parts.ex button{border-style:dashed}
.cards{display:grid;gap:5px}.fc{text-align:start;border:1.5px solid var(--line);background:rgba(255,255,255,.04);color:var(--ink);font:600 .88rem var(--body);padding:7px 10px;border-radius:12px;cursor:pointer}
.fc.on{border-color:#FFD27A;background:rgba(255,210,122,.12)}.fc.done{border-color:var(--ok);background:var(--ok-bg);cursor:default}.fc b{color:var(--accent)}
.rep{display:grid;gap:8px}.ri{border:1.5px solid var(--line);border-radius:12px;padding:8px 10px}.ri p{margin:0;font-size:.88rem}.ri .lv{font-weight:700;margin-top:4px}
.bar{height:8px;background:rgba(255,255,255,.1);border-radius:99px;overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:var(--ok)}
.ri.mid .bar i{background:#FFD27A}.ri.low .bar i{background:var(--bad)}.ri.ok{border-color:var(--ok)}.ri.mid{border-color:#FFD27A}.ri.low{border-color:var(--bad)}
.rst{text-align:center;margin:0}.lnk{border:0;background:none;color:var(--muted);font:600 .78rem var(--body);text-decoration:underline;cursor:pointer}
.go+.tg{margin-top:-2px}
.side{position:fixed;inset-inline-start:max(12px,env(safe-area-inset-right,0px));top:50%;transform:translateY(-50%);z-index:5;display:grid;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:8px 6px;backdrop-filter:blur(8px)}
.side button{width:40px;height:40px;border-radius:50%;border:1.5px solid var(--line);background:rgba(255,255,255,.06);color:var(--ink);font:700 1.3rem var(--body);cursor:pointer;line-height:1}
@media (max-width:759px){h1 small{display:none}.side{top:calc(50% - 24vh)}.side button{width:34px;height:34px;font-size:1.1rem}h1{font-size:1rem;padding:4px 12px 2px}#tabs button{padding:3px 7px;font-size:.72rem}.pill{padding:4px 10px;font-size:.76rem}.card{max-height:48vh}}
@media (min-width:760px){.card{width:min(420px,37vw)}}
#load{position:fixed;inset:0;z-index:9;display:grid;place-items:center;background:#0B1A22;color:var(--ink);font:700 1.1rem var(--body)}

const ray=new T.Raycaster(),NDC=new T.Vector2();
function hitsAt(x,y){const r=cv.getBoundingClientRect();NDC.set((x-r.left)/r.width*2-1,-(y-r.top)/r.height*2+1);ray.setFromCamera(NDC,cam);
  const g=GROUPS[SCN];if(!g)return [];const vis=o=>{for(let p=o;p;p=p.parent){if(!p.visible)return false;if(p===g)return true;}return false;};
  return ray.intersectObjects(MESHES.filter(m=>m.userData.tag&&vis(m)),false);}
function pick(x,y){const hs=hitsAt(x,y);if(!hs.length)return;const g=GROUPS[SCN];
  if(SCN==='cork'){toast('قطعة من الفلين. اضغط «افحص الفلين بالمجهر» لترى ممّ تتكوّن.');return;}
  if(SCN==='corkcells'){toast('كل صندوق صغير هنا خلية من خلايا الفلين.');return;}
  if(SCN==='org'){const o=ORGS[S.orgSel];toast(o.n+': '+(o.u?'خلية واحدة':'ما تراه جزء صغير جدًا، وكل كتلة هنا خلية'));return;}
  if(SCN==='div')return;
  const plant=SCN==='plant',LC=plant?LCP:LCA,G=plant?PB_:GA;const cl=new Set(['mem','cyto','wall','chl','mito']);
  const ok=h=>!(LC.constant<50&&cl.has(h.object.userData.tag)&&G.worldToLocal(h.point.clone()).z>LC.constant+.01);
  const tags=hs.filter(ok).map(h=>h.object.userData.tag).filter(t=>t!=='sub');if(!tags.length)return;
  let t=tags[0];if((t==='cyto'||t==='vac')&&tags.slice(1).some(x=>['nuc','mito','chl'].includes(x))&&t==='cyto')t=tags.slice(1).find(x=>['nuc','mito','chl'].includes(x));
  if(plant&&t==='vac'){const b=tags.slice(1).find(x=>['nuc','chl','mito'].includes(x));if(b)t=b;}
  if(S.st===4&&!S.score&&QZ[S.qi].pick){answerPick(t);return;}
  if(S.st===3){if(CORE.includes(t))matchCard(t);else toast((EXTRA[t]||{n:''}).n+': ليس من التراكيب الأربعة في هذه البطاقات.');return;}
  if(S.st===2){toast(((PARTS[t]||EXTRA[t])||{n:''}).n);return;}
  if(S.st===1)select(t);}
