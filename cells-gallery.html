<!doctype html>
<html lang="ar" dir="rtl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>معرض الخلايا ثلاثي الأبعاد</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@600;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: a dark specimen chamber (the 3D stage) beside a calm label card, like a museum vitrine; exhibits switch from a top strip. */
:root{--bg:#F3F5F8;--paper:#FFFFFF;--ink:#16202E;--muted:#5C6878;--line:#DCE2EA;--accent:#0F7C78;--accent-soft:#E0F2F0;--ok:#15803D;--ok-bg:#E8F7EE;--bad:#C2410C;--bad-bg:#FFF1E8;--chamber:#0D1522;--chamber2:#1B2A40;
 --display:"Baloo Bhaijaan 2","IBM Plex Sans Arabic",system-ui,sans-serif;--body:"IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0F141C;--paper:#171E2A;--ink:#E8EDF4;--muted:#A2ADBD;--line:#2A3444;--accent:#4FC7C0;--accent-soft:#16302F;--ok:#4ADE80;--ok-bg:#122A1C;--bad:#FB923C;--bad-bg:#2E1C10;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0F141C;--paper:#171E2A;--ink:#E8EDF4;--muted:#A2ADBD;--line:#2A3444;--accent:#4FC7C0;--accent-soft:#16302F;--ok:#4ADE80;--ok-bg:#122A1C;--bad:#FB923C;--bad-bg:#2E1C10;color-scheme:dark}
html,body{direction:rtl}*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.65;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 28px}
.wrap{max-width:1180px;margin:0 auto;display:grid;gap:14px}
header{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:6px 20px}
h1{margin:0;font:800 clamp(1.5rem,3.4vw,2.1rem)/1.2 var(--display);text-wrap:balance}
.sub{margin:0;color:var(--muted);font-size:.85rem}
#tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:thin}
.tab{flex:none;display:flex;align-items:center;gap:8px;border:1.5px solid var(--line);background:var(--paper);color:var(--ink);border-radius:12px;padding:7px 14px 7px 10px;font:600 .95rem var(--body);cursor:pointer}
.tab i{font-style:normal;display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--line);font-size:.78rem;font-weight:700}
.tab[aria-selected="true"]{border-color:var(--accent);background:var(--accent-soft)}.tab[aria-selected="true"] i{background:var(--accent);color:#fff}
.tab.done i{background:var(--ok);color:#fff}
main{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(300px,1fr);gap:14px;align-items:start}
.stage{position:relative;border-radius:18px;overflow:hidden;background:radial-gradient(120% 90% at 50% 40%,var(--chamber2),var(--chamber));aspect-ratio:4/3;max-width:100%;touch-action:none;user-select:none}
#cv{width:100%;height:100%;display:block;cursor:grab}#cv:active{cursor:grabbing}
.hud{position:absolute;inset-inline:12px;bottom:12px;display:flex;justify-content:space-between;align-items:center;gap:8px;pointer-events:none}
.hint{background:rgba(255,255,255,.1);color:#D6E0EE;border-radius:99px;padding:3px 12px;font-size:.8rem;backdrop-filter:blur(4px)}
#reset{white-space:nowrap;pointer-events:auto;border:1px solid rgba(255,255,255,.25);background:rgba(13,21,34,.6);color:#E6EDF6;border-radius:10px;padding:5px 12px;font:600 .82rem var(--body);cursor:pointer}
.scale{position:absolute;top:12px;inset-inline-start:12px;color:#BFD0E4;font-size:.78rem;background:rgba(13,21,34,.55);border-radius:8px;padding:2px 10px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:16px 18px;display:grid;gap:12px;min-width:0}
.kick{margin:0;font-size:.8rem;color:var(--accent);font-weight:700;letter-spacing:.02em}
h2{margin:0;font:800 1.45rem/1.3 var(--display)}
.lead{margin:0}
.ctl{display:grid;gap:8px;border-top:1px solid var(--line);padding-top:12px}
.ctl label{font-weight:600;font-size:.92rem}
input[type=range]{width:100%;direction:ltr;accent-color:var(--accent)}
.ends{display:flex;justify-content:space-between;direction:ltr;font-size:.78rem;color:var(--muted);margin-top:-6px}
.seg{display:flex;flex-wrap:wrap;gap:6px}.seg button{border:1.5px solid var(--line);background:var(--paper);color:var(--ink);border-radius:10px;padding:6px 12px;font:600 .9rem var(--body);cursor:pointer}.seg button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.read{margin:0;font-size:.9rem;color:var(--muted);min-height:1.5em}.read b{color:var(--ink)}
.q{display:grid;gap:8px;border-top:1px solid var(--line);padding-top:12px}.q p{margin:0;font-weight:700}
.opt{text-align:start;border:1.5px solid var(--line);background:var(--paper);color:var(--ink);border-radius:12px;padding:9px 14px;font:500 .95rem var(--body);cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--accent)}.opt.right{border-color:var(--ok);background:var(--ok-bg)}.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}.opt:disabled{cursor:default}
.fb{margin:0;font-size:.92rem;min-height:1.4em}.fb.ok{color:var(--ok)}.fb.bad{color:var(--bad)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.85rem;color:var(--muted)}.legend span{display:inline-flex;align-items:center;gap:6px}.legend i{width:13px;height:13px;border-radius:50%;display:inline-block;border:1px solid rgba(0,0,0,.35)}
.nav{display:flex;justify-content:space-between;gap:8px}.nav button{border:0;background:var(--accent);color:#fff;border-radius:10px;padding:8px 16px;font:700 .92rem var(--body);cursor:pointer}.nav button:disabled{background:var(--line);color:var(--muted);cursor:default}
.src{font-size:.78rem;color:var(--muted);margin:0}
:focus-visible{outline:3px solid #F59F00;outline-offset:2px}
@media (max-width:860px){main{grid-template-columns:1fr}.stage{aspect-ratio:1/1}}
@media (max-width:520px){.long{display:none}}
.hint{white-space:nowrap}
</style>

<div class="wrap">
 <header><div><h1>معرض الخلايا ثلاثي الأبعاد</h1><p class="sub">العلوم · الصف السادس · نظرية الخلية (الكتاب ص٢٢–٢٩) · مدرسة الحافظ بن عساكر الابتدائية · أ. خالد رفيع الحمدي</p></div></header>
 <nav id="tabs" role="tablist" aria-label="المعروضات"></nav>
 <main>
  <div class="stage" id="stage"><canvas id="cv" aria-label="نموذج ثلاثي الأبعاد: اسحب لتدويره"></canvas>
   <span class="scale" id="scale"></span>
   <div class="hud"><span class="hint">اسحب للتدوير<span class="long"> · مرّر أو اقرص للتقريب</span></span><button id="reset" type="button">↺ إعادة المنظر</button></div></div>
  <section class="card" aria-live="polite">
   <p class="kick" id="kick"></p><h2 id="name"></h2><p class="lead" id="lead"></p>
   <div class="ctl" id="ctl"></div>

   <div class="nav"><button id="prev" type="button">→ السابق</button><button id="next" type="button">التالي ←</button></div>
  </section>
 </main>
</div>

<script>
(()=>{'use strict';document.documentElement.dir='rtl';document.documentElement.lang='ar';
const $=s=>document.querySelector(s),ar=n=>Number(n).toLocaleString('ar-SA');
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const cv=$('#cv'),cx=cv.getContext('2d');let W=0,H=0,DPR=1;
const fit=()=>{const r=cv.getBoundingClientRect();DPR=Math.min(devicePixelRatio||1,2);W=r.width;H=r.height;cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);};
new ResizeObserver(fit).observe($('#stage'));fit();

/* ===== محرّك ثلاثي الأبعاد صغير (رسم بالترتيب من الأبعد إلى الأقرب) ===== */
const cam={yaw:.7,pitch:.45,dist:12,ty:0};let tgt=null,spin=!reduce;
const P=p=>{const cy=Math.cos(cam.yaw),sy=Math.sin(cam.yaw),cp=Math.cos(cam.pitch),sp=Math.sin(cam.pitch);
  const x1=p[0]*cy-p[2]*sy,z1=p[0]*sy+p[2]*cy,y=p[1]-cam.ty,y2=y*cp-z1*sp,z2=y*sp+z1*cp,d=cam.dist-z2,s=Math.min(W,H)*1.15/Math.max(d,.5);return [W/2+x1*s,H/2-y2*s,d,s];};
const LIGHT=(()=>{const v=[-.45,.8,.55],n=Math.hypot(...v);return v.map(a=>a/n);})();
const rgb=h=>{const n=parseInt(h.slice(1),16);return [n>>16&255,n>>8&255,n&255];};
const col=(h,k,a=1)=>{const c=rgb(h).map(v=>Math.max(0,Math.min(255,Math.round(v*k))));return `rgba(${c[0]},${c[1]},${c[2]},${a})`;};
const sub=(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]],crs=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];
let Q=[],LB=[];
const poly=(pts,c,a=1,st=null,lw=1)=>Q.push({k:'p',pts,c,a,st,lw});
const ball=(p,r,c,a=1)=>Q.push({k:'s',p,r,c,a});
const rod=(p,q,r,c,a=1)=>Q.push({k:'l',p,q,r,c,a});
const label=(p,t)=>LB.push({p,t});
/* قصّ مضلع بمستوى: يبقى ما يحقق n·p <= c */
const clip=(pts,n,c)=>{const o=[];for(let i=0;i<pts.length;i++){const A=pts[i],B=pts[(i+1)%pts.length],da=A[0]*n[0]+A[1]*n[1]+A[2]*n[2]-c,db=B[0]*n[0]+B[1]*n[1]+B[2]*n[2]-c;
  if(da<=0)o.push(A);if((da<=0)!==(db<=0)){const t=da/(da-db);o.push([A[0]+(B[0]-A[0])*t,A[1]+(B[1]-A[1])*t,A[2]+(B[2]-A[2])*t]);}}return o;};
const draw=()=>{cx.setTransform(DPR,0,0,DPR,0,0);cx.clearRect(0,0,W,H);
  const it=Q.map(o=>{if(o.k==='p'){const pr=o.pts.map(P);o.pr=pr;o.d=pr.reduce((s,v)=>s+v[2],0)/pr.length;
      const nn=crs(sub(o.pts[1],o.pts[0]),sub(o.pts[2],o.pts[0])),L=Math.hypot(...nn)||1;o.sh=.55+.5*Math.abs((nn[0]*LIGHT[0]+nn[1]*LIGHT[1]+nn[2]*LIGHT[2])/L);}
    else if(o.k==='s'){o.pr=P(o.p);o.d=o.pr[2];}else{o.pa=P(o.p);o.pb=P(o.q);o.d=(o.pa[2]+o.pb[2])/2;}return o;}).sort((a,b)=>b.d-a.d);
  for(const o of it){cx.globalAlpha=o.a;
    if(o.k==='p'){cx.beginPath();o.pr.forEach((v,i)=>i?cx.lineTo(v[0],v[1]):cx.moveTo(v[0],v[1]));cx.closePath();cx.fillStyle=col(o.c,o.sh);cx.fill();if(o.st){cx.strokeStyle=o.st;cx.lineWidth=o.lw;cx.lineJoin='round';cx.stroke();}}
    else if(o.k==='s'){const [x,y,,s]=o.pr,r=o.r*s;if(r<.3)continue;const g=cx.createRadialGradient(x-r*.35,y-r*.4,r*.1,x,y,r);g.addColorStop(0,col(o.c,1.55));g.addColorStop(.55,col(o.c,1));g.addColorStop(1,col(o.c,.55));cx.fillStyle=g;cx.beginPath();cx.arc(x,y,r,0,7);cx.fill();}
    else{cx.strokeStyle=col(o.c,1);cx.lineCap='round';cx.lineWidth=Math.max(1,o.r*2*(o.pa[3]+o.pb[3])/2);cx.beginPath();cx.moveTo(o.pa[0],o.pa[1]);cx.lineTo(o.pb[0],o.pb[1]);cx.stroke();}}
  cx.globalAlpha=1;cx.font='600 13px "IBM Plex Sans Arabic",system-ui,sans-serif';cx.direction='rtl';cx.textBaseline='middle';
  for(const l of LB){const [x,y]=P(l.p);const w=cx.measureText(l.t).width+16,lx=Math.min(W-w/2-6,Math.max(w/2+6,x+34)),ly=Math.max(14,y-30);
    cx.strokeStyle='rgba(255,255,255,.7)';cx.lineWidth=1.2;cx.beginPath();cx.moveTo(x,y);cx.lineTo(lx,ly);cx.stroke();cx.fillStyle='#fff';cx.beginPath();cx.arc(x,y,3,0,7);cx.fill();
    cx.fillStyle='rgba(13,21,34,.85)';cx.beginPath();cx.roundRect?cx.roundRect(lx-w/2,ly-11,w,22,8):cx.rect(lx-w/2,ly-11,w,22);cx.fill();cx.fillStyle='#F3F7FC';cx.textAlign='center';cx.fillText(l.t,lx,ly);}};

/* ===== المعروضات ===== */
const hexPts=(x,z,R,y)=>[0,1,2,3,4,5].map(k=>[x+R*Math.cos(k*Math.PI/3),y,z+R*Math.sin(k*Math.PI/3)]);
const lerp=(a,b,t)=>a+(b-a)*t;
const EX=[
{id:'cork',tab:'خلايا الفلين',name:'خلايا الفلين',lead:'حجرات صغيرة متراصّة. اقطع طبقة لترى داخلها.',pg:'٢٣–٢٤',view:{yaw:.7,pitch:.55,dist:13,ty:-.3},scale:'نموذج مكبّر · قطعة فلين',
 st:{cut:0},
 ctl(c,s){c.innerHTML='<label for="cut">اقطع طبقات من الأعلى</label><input id="cut" type="range" min="0" max="2" step="1" value="0"><div class="ends"><span>قطعة كاملة</span><span>قطع طبقتين</span></div><div class="seg"><button type="button" id="topv">🔬 انظر من الأعلى كالمجهر</button></div><p class="read" id="rd"></p>';
  const rd=$('#rd'),f=()=>{s.cut=+$('#cut').value;rd.innerHTML=s.cut?'الحجرات <b>مجوّفة</b>، ولكل منها جدران. هذه الجدران ما رآه هوك.':'السطح مغلق. حرّك المؤشر لتقطع.';};$('#cut').oninput=f;f();
  $('#topv').onclick=()=>{if(!s.cut){$('#cut').value=1;f();}tgt={yaw:0,pitch:1.5,dist:11,ty:0};spin=false;rd.innerHTML='من الأعلى تظهر الحجرات كخلايا النحل؛ هكذا رآها هوك عام <b>١٦٦٥م</b>.';};},
 build(s){const R=.55,HH=.9,L=3,top=L-1-s.cut;
  for(let c=-4;c<=4;c++)for(let r=-3;r<=3;r++){const x=c*R*1.5,z=r*R*Math.sqrt(3)+(c&1?R*Math.sqrt(3)/2:0);if(Math.hypot(x,z*1.15)>3.3)continue;
   for(let l=0;l<=top;l++){const y0=l*HH-1.2,y1=y0+HH*.98,b=hexPts(x,z,R,y0),t=hexPts(x,z,R,y1);
    for(let k=0;k<6;k++)poly([b[k],b[(k+1)%6],t[(k+1)%6],t[k]],'#D9A866',1,'#7A4E22',.8);
    poly(b,'#B98A4E',1,'#7A4E22',.8);if(l===top&&s.cut===0)poly(t,'#C99555',1,'#7A4E22',.6);}}
  if(s.cut)label([0,(2-s.cut)*.9-1.2+.6,0],'خلية: حجرة مجوّفة');},
 q:['الحجرات التي رآها هوك بالمجهر هي:',['نقوش مرسومة على سطح الفلين','جدران حجرات مجوّفة متراصّة','فقاعات هواء متفرّقة'],1,{0:'اقطع طبقة: هل الحجرات على السطح فقط أم لها عمق؟',2:'الفقاعات متفرّقة ومستديرة، وهذه حجرات متلاصقة لها جدران.'},'صحيح. سمّاها هوك <b>خلايا</b>.']},
{id:'plant',tab:'خلية نبات حي',name:'خلايا من نبات حي',lead:'رأى براون داخل الخلية الحيّة جسمًا يتكرر. اقطع الخلايا لتراه.',pg:'٢٥',view:{yaw:.5,pitch:.35,dist:11,ty:0},scale:'نموذج مكبّر · خلايا نبات حي',
 st:{c:.8},
 ctl(c,s){c.innerHTML='<label for="pc">اقطع الخلايا من الأمام</label><input id="pc" type="range" min="0" max="100" value="0"><div class="ends"><span>خلايا كاملة</span><span>قطع حتى المنتصف</span></div><p class="read" id="rd"></p>';
  const f=()=>{const v=+$('#pc').value;s.c=lerp(.8,-.05,v/100);$('#rd').innerHTML=v>60?'في كل خلية <b>نواة</b>: جسم مستدير داخل الخلية. اكتشفها براون عام <b>١٨٣١م</b>.':'جدران الخلايا تخفي ما بداخلها. حرّك المؤشر.';};$('#pc').oninput=f;f();},
 build(s,t){const w=2.2,h=1.5,d=1.5,n=[0,0,1];
  for(let i=-1;i<=1;i++)for(let j=0;j<=1;j++){const x0=i*w-w/2,y0=j*h-h,x1=x0+w,y1=y0+h,z0=-d/2,z1=d/2;
   const F=[[[x0,y0,z1],[x1,y0,z1],[x1,y1,z1],[x0,y1,z1]],[[x0,y0,z0],[x0,y1,z0],[x1,y1,z0],[x1,y0,z0]],[[x0,y0,z0],[x0,y0,z1],[x0,y1,z1],[x0,y1,z0]],[[x1,y0,z0],[x1,y1,z0],[x1,y1,z1],[x1,y0,z1]],[[x0,y1,z0],[x0,y1,z1],[x1,y1,z1],[x1,y1,z0]],[[x0,y0,z0],[x1,y0,z0],[x1,y0,z1],[x0,y0,z1]]];
   F.forEach((f,k)=>{const cp=clip(f,n,s.c);if(cp.length>=3)poly(cp,'#9ED38A',k===0?.92:.5,'#3E7A2E',1.4);});
   const id=(i+1)*2+j,nx=x0+w*(.32+.36*((id*37)%10)/10),ny=y0+h*(.35+.3*((id*53)%10)/10);ball([nx,ny,0],.27,'#6E47A8');
   for(let g=0;g<5;g++)ball([x0+.25+((g*71+id*13)%17)/17*(w-.5),y0+.2+((g*29+id*7)%11)/11*(h-.4),((g*3+id)%5)/5*.9-.45],.06,'#E8F0C8',.9);
   if(i===0&&j===1&&s.c<.3)label([nx,ny,0],'النواة');}
  label([-w*1.5,.2,s.c<.75?-.2:.75],'جدار الخلية');},
 q:['أين توجد النواة؟',['على الجدار الخارجي للخلية','داخل الخلية','بين خليتين متجاورتين'],1,{0:'اقطع الخلية: هل النواة على السطح؟',2:'لاحظ: في كل خلية نواة واحدة داخلها.'},'صحيح. إذن الخلية الحيّة ليست صندوقًا فارغًا.']},
{id:'param',tab:'البراميسيوم',name:'البراميسيوم',lead:'مخلوق حي كامل من خلية واحدة، يسبح في ماء البركة بأهدابه.',pg:'٢٥',view:{yaw:.3,pitch:.5,dist:10,ty:0},scale:'نموذج مكبّر · قطرة من ماء البركة',
 st:{swim:!reduce,t0:0},
 ctl(c,s){c.innerHTML='<div class="seg"><button type="button" id="sw" aria-pressed="'+s.swim+'">'+(s.swim?'⏸ أوقف السباحة':'▶ اجعله يسبح')+'</button></div><p class="read">الشعيرات الصغيرة حول جسمه <b>أهداب</b>؛ يحرّكها فيسبح. شاهده ليفنهوك بمجهره الأقوى.</p>';
  $('#sw').onclick=e=>{s.swim=!s.swim;e.target.setAttribute('aria-pressed',s.swim);e.target.textContent=s.swim?'⏸ أوقف السباحة':'▶ اجعله يسبح';};},
 build(s,t){const tt=s.swim?t:s.t0;if(s.swim)s.t0=t;const ang=tt*.35,px=Math.cos(ang)*1.6,pz=Math.sin(ang)*1.1,hd=Math.atan2(Math.cos(ang)*1.1,-Math.sin(ang)*1.6);
